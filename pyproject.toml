[project]
name = "mini-analytics-agent"
version = "0.1.0"
description = "Governed text-to-SQL analytics agent on Snowflake. Learning project on synthetic data."
requires-python = ">=3.11"
dependencies = [
    "snowflake-connector-python[pandas]",
    "python-dotenv",
    "pydantic",
    "pyyaml",
    "sqlglot",
    "langgraph>=1.2.13",
    "anthropic>=1.11.0",
    "langsmith>=0.14.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
link-mode = "copy"  # OneDrive folders do not support uv's default hardlinks

[tool.ruff]
line-length = 100
extend-exclude = ["Li"]  # Li's hand-written practice copies, not part of the agent
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
